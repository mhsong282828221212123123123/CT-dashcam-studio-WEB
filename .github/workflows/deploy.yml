name: Deploy production and dev to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read
  pages: write
  id-token: write

# A Pages deployment replaces the entire site. Publish both branches and the preview together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build-editor:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Check out the reviewed editor source
        uses: actions/checkout@v4
        with:
          ref: 69965b174ac1768b3a041a8a98f0d002431a08fc
          persist-credentials: false

      - name: Set up Node.js for the editor
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc

      - name: Set up pnpm
        uses: pnpm/action-setup@v6

      - name: Install and test the editor
        run: |
          pnpm install --frozen-lockfile
          pnpm test

      - name: Build the editor for the production root
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/
        run: |
          pnpm build
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const info = { channel: 'production', branch: 'main', commit };
          writeFileSync('dist/deployment.json', JSON.stringify(info, null, 2) + '\n');
          JS

      - name: Upload the production editor
        uses: actions/upload-artifact@v4
        with:
          name: production-editor
          path: dist/
          if-no-files-found: error
          retention-days: 1

      - name: Build the existing /preview/pr-1/ entry point
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/preview/pr-1/
        run: |
          pnpm build
          node --input-type=module <<'JS'
          import { execFileSync } from 'node:child_process';
          import { writeFileSync } from 'node:fs';
          const commit = execFileSync('git', ['rev-parse', 'HEAD'], { encoding: 'utf8' }).trim();
          const info = { channel: 'preview', pullRequest: 1, commit };
          writeFileSync('dist/deployment.json', JSON.stringify(info, null, 2) + '\n');
          JS

      - name: Upload the preview build
        uses: actions/upload-artifact@v4
        with:
          name: pr-1-preview
          path: dist/
          if-no-files-found: error
          retention-days: 1

  build:
    needs: build-editor
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source

      - name: Checkout dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production-source/package-lock.json
            dev-source/package-lock.json

      - name: Build the classic editor from main
        working-directory: production-source
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/classic/
        run: |
          npm ci
          npm test
          npm run build
          node scripts/write-deployment-info.mjs classic
          mkdir -p ../site_out/classic
          cp -r dist/. ../site_out/classic/

      - name: Build test site from dev
        working-directory: dev-source
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/dev/
        run: |
          npm ci
          npm test
          npm run build
          node scripts/write-deployment-info.mjs dev
          mkdir -p ../site_out/dev
          cp -r dist/. ../site_out/dev/

      - name: Add the production editor at the root
        uses: actions/download-artifact@v4
        with:
          name: production-editor
          path: site_out/

      - name: Preserve public introduction pages and sitemap
        run: cp -r site_out/classic/{intro,robots.txt,sitemap.xml} site_out/

      - name: Add the PR 1 preview
        uses: actions/download-artifact@v4
        with:
          name: pr-1-preview
          path: site_out/preview/pr-1/

      - name: Upload all four sites as one Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
