name: Deploy production and dev to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A Pages deployment replaces the entire site. Always publish both branches together.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout production source
        uses: actions/checkout@v4
        with:
          ref: main
          path: production-source

      - name: Checkout dev source
        uses: actions/checkout@v4
        with:
          ref: dev
          path: dev-source

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            production-source/package-lock.json
            dev-source/package-lock.json

      - name: Build production from main
        working-directory: production-source
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/
        run: |
          npm ci
          npm test
          npm run build
          node scripts/write-deployment-info.mjs production
          mkdir -p ../site_out
          cp -r dist/. ../site_out/

      - name: Build test site from dev
        working-directory: dev-source
        env:
          VITE_BASE_PATH: /CT-dashcam-studio-WEB/dev/
        run: |
          npm ci
          npm test
          npm run build
          node scripts/write-deployment-info.mjs dev
          mkdir -p ../site_out/dev
          cp -r dist/. ../site_out/dev/

      - name: Upload both sites as one Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: site_out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
