name: Deploy CT Dashcam Studio WEB to GitHub Pages

on:
  push:
    branches:
      - main
      - dev
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Create combined deployment directory
        run: mkdir -p site_out

      # 1. Checkout and Build 'main' branch (Production -> /)
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          path: repo_main

      - name: Build main branch
        run: |
          cd repo_main
          npm ci
          VITE_BASE_PATH='/CT-dashcam-studio-WEB/' npm run build
          cp -r dist/* ../site_out/

      # 2. Checkout and Build 'dev' branch (Development -> /dev/)
      - name: Checkout dev branch
        uses: actions/checkout@v4
        with:
          ref: dev
          path: repo_dev
        continue-on-error: true

      - name: Build dev branch if present
        run: |
          if [ -d "repo_dev" ]; then
            cd repo_dev
            npm ci
            VITE_BASE_PATH='/CT-dashcam-studio-WEB/dev/' npm run build
            mkdir -p ../site_out/dev
            cp -r dist/* ../site_out/dev/
          fi

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
