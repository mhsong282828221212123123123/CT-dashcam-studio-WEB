name: Deploy CT Dashcam Studio WEB to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install dependencies
        run: npm ci

      - name: Build Production site (Root /)
        run: |
          mkdir -p site_out
          VITE_BASE_PATH='/CT-dashcam-studio-WEB/' npm run build
          cp -r dist/* site_out/

      - name: Build Test/Dev site (Subpath /dev/)
        run: |
          mkdir -p site_out/dev
          VITE_FACE_BLUR='1' VITE_BASE_PATH='/CT-dashcam-studio-WEB/dev/' npm run build
          cp -r dist/* site_out/dev/

      - name: Upload artifact for GitHub Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./site_out

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
